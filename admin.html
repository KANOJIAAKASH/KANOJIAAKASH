<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Site Editor — Akash Kanojia</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230e7c86'/><text x='32' y='42' font-family='Georgia,serif' font-size='28' fill='white' text-anchor='middle'>✎</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">Site Editor</a>
      <span id="status" class="status-line" aria-live="polite"></span>
      <div class="btn-row" style="margin-left:auto">
        <a class="btn" href="index.html?preview" target="_blank" rel="noopener" title="Open the site with your unsaved changes">Preview</a>
        <button id="publish-btn" class="btn primary" type="button">Publish to GitHub</button>
      </div>
    </div>
  </header>

  <div class="container admin-layout">
    <nav id="side" class="admin-side" aria-label="Editor sections"></nav>
    <main id="panel" class="panel"></main>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="data/profile.js"></script>
  <script src="assets/js/schema.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
